apiVersion: apps/v1
kind: Deployment
metadata:
  name: docsync
spec:
  replicas: 1
  selector:
    matchLabels: {app: docsync}
  template:
    metadata:
      labels: {app: docsync}
    spec:
      containers:
        - name: app
          image: us-central1-docker.pkg.dev/docsync-vllm-anagha/docsync/app:v2
          ports:
            - containerPort: 8501
          env:
            - {name: LLM_BASE_URL, value: "http://vllm:8000/v1"}
            - {name: LLM_API_KEY, value: "EMPTY"}
            - {name: LLM_MODEL, value: "Qwen/Qwen2.5-7B-Instruct"}
          resources:
            requests: {cpu: 500m, memory: 1536Mi}
            limits: {cpu: "2", memory: 4Gi}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: 8501}
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: docsync
spec:
  type: LoadBalancer
  sessionAffinity: ClientIP
  selector: {app: docsync}
  ports:
    - port: 80
      targetPort: 8501
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: docsync
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: docsync}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}